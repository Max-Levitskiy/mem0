name: mem0-dev

services:
  mem0:
    build:
      context: ..
      dockerfile: server/dev.Dockerfile
    ports:
      - "${MEM0_PORT:-8888}:8000"
    env_file:
      - .env
    networks:
      - mem0_network
    volumes:
      - ./history:/app/history
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=
      - DASHBOARD_URL=${DASHBOARD_URL:-http://localhost:3000}
      - APP_DB_NAME=${APP_DB_NAME:-mem0_app}
      - JWT_SECRET=${JWT_SECRET}
      - AUTH_DISABLED=${AUTH_DISABLED:-false}
      - MEM0_TELEMETRY=${MEM0_TELEMETRY:-true}

  postgres:
      image: pgvector/pgvector:pg17
      restart: on-failure
      shm_size: "128mb"
      networks:
        - mem0_network
      environment:
        - POSTGRES_USER=${POSTGRES_USER:-postgres}
        - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -q -d postgres -U ${POSTGRES_USER:-postgres}"]
        interval: 5s
        timeout: 5s
        retries: 5
      volumes:
        - postgres_db:/var/lib/postgresql/data
        - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
      ports:
        - "${POSTGRES_HOST_PORT:-8432}:5432"

  mem0-dashboard:
    build: ./dashboard
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    networks:
      - mem0_network
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8888}
      - API_INTERNAL_URL=${API_INTERNAL_URL:-http://mem0:8000}
      - NEXT_PUBLIC_INSTANCE_NAME=${NEXT_PUBLIC_INSTANCE_NAME:-Mem0}
    depends_on:
      mem0:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  mem0-mcp:
    build: ./mcp
    ports:
      - "${MEM0_MCP_PORT:-8767}:8000"
    networks:
      - mem0_network
    environment:
      - MCP_TRANSPORT=http
      - MEM0_BASE_URL=${MEM0_MCP_BASE_URL:-http://mem0:8000}
      - MEM0_API_KEY=${MEM0_MCP_API_KEY:?Set MEM0_MCP_API_KEY in .env to an API key minted from this server}
      - MCP_BEARER_TOKEN=${MCP_BEARER_TOKEN:?Set MCP_BEARER_TOKEN in .env — clients must send it as their bearer token}
      - MEM0_DEFAULT_USER_ID=${MEM0_MCP_DEFAULT_USER_ID:-}
      - MEM0_DEFAULT_AGENT_ID=${MEM0_MCP_DEFAULT_AGENT_ID:-}
    depends_on:
      mem0:
        condition: service_started

volumes:
  postgres_db:

networks:
  mem0_network:
    driver: bridge
